<html lang="en">
<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Estate Enquiries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark teal rail (river-night) + light mist workspace. Fraunces for display and prices, Manrope for UI. Marigold is the only warm accent. Phones swap the rail for a bottom tab bar. */
:root{
  --bg:#f1f4f2; --surface:#ffffff; --ink:#10282a; --muted:#5b6f70; --line:#dce4e1;
  --rail:#0c2527; --rail-ink:#dcebe8; --rail-muted:#84a3a0; --rail-line:#1b3b3d; --rail-hover:#143133; --rail-on:#17413f;
  --accent:#0f6b66; --accent-ink:#ffffff; --accent-soft:#dcefec; --accent-text:#0a5651;
  --gold:#e6a419; --gold-soft:#fbefcf; --gold-ink:#7a5000;
  --blue-soft:#e3ebf6; --blue-ink:#2b4a76; --rose:#b0402c; --warn-bg:#fbefcf; --warn-ink:#6f4a00;
  --field:#ffffff; --hover:#e9f0ed; --avs:42%; --avl:87%; --avt:#173f3d;
  --shadow:0 1px 2px rgba(16,40,42,.06),0 10px 28px -14px rgba(16,40,42,.22);
  --display:'Fraunces','Iowan Old Style',Georgia,serif;
  --body:'Manrope','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1718; --surface:#112526; --ink:#e3efec; --muted:#8fa8a5; --line:#203b3c;
  --rail:#071213; --rail-ink:#dcebe8; --rail-muted:#7d9b98; --rail-line:#173031; --rail-hover:#102a2b; --rail-on:#16403e;
  --accent:#1f8a84; --accent-ink:#ffffff; --accent-soft:#16393a; --accent-text:#7fd3cb;
  --gold:#e6a419; --gold-soft:#3a2f10; --gold-ink:#f0c766; --blue-soft:#1b2d46; --blue-ink:#a9c4ec; --rose:#e48a77; --warn-bg:#3a2f10; --warn-ink:#f0c766;
  --field:#0a1718; --hover:#183031; --avs:28%; --avl:24%; --avt:#d4ece8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1718; --surface:#112526; --ink:#e3efec; --muted:#8fa8a5; --line:#203b3c;
  --rail:#071213; --rail-ink:#dcebe8; --rail-muted:#7d9b98; --rail-line:#173031; --rail-hover:#102a2b; --rail-on:#16403e;
  --accent:#1f8a84; --accent-ink:#ffffff; --accent-soft:#16393a; --accent-text:#7fd3cb;
  --gold:#e6a419; --gold-soft:#3a2f10; --gold-ink:#f0c766; --blue-soft:#1b2d46; --blue-ink:#a9c4ec; --rose:#e48a77; --warn-bg:#3a2f10; --warn-ink:#f0c766;
  --field:#0a1718; --hover:#183031; --avs:28%; --avl:24%; --avt:#d4ece8;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-family:var(--display);font-size:clamp(28px,4vw,44px);line-height:1.08;letter-spacing:-.025em;font-weight:500;text-wrap:balance;max-width:18ch}
h2{font-family:var(--display);font-size:20px;font-weight:500;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;letter-spacing:-.005em}
p{color:var(--muted)}
small{font-size:12px;color:var(--muted)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
code{font-size:12px;background:var(--accent-soft);color:var(--accent-text);padding:1px 6px;border-radius:5px}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* rail */
.rail{position:sticky;top:0;align-self:start;height:100vh;background:var(--rail);color:var(--rail-ink);padding:26px 18px 22px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px}
.brand b{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--gold),#c27a0b);color:#2a1a00}
.bt{font-family:var(--display);font-size:21px;font-weight:500;letter-spacing:-.02em;line-height:1.05}
.bt span{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--rail-muted);margin-top:4px}
.nav{margin-top:36px;display:grid;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;text-align:left;padding:11px 12px;border-radius:10px;color:var(--rail-muted);font-weight:600;transition:background .15s,color .15s}
.nav button:hover{background:var(--rail-hover);color:var(--rail-ink)}
.nav button.on{background:var(--rail-on);color:#fff}
.nav button.on svg{color:var(--gold)}
.nav .n{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);padding:1px 8px;border-radius:99px;color:var(--rail-ink)}
.markets{margin-top:30px;padding:18px 12px 0;border-top:1px solid var(--rail-line)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent-text)}
.markets .eyebrow{color:var(--rail-muted)}
.mk{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;font-weight:600}
.mk small{margin-left:auto;color:var(--rail-muted);font-variant-numeric:tabular-nums}
.mkleg{display:block;margin-top:10px;color:var(--rail-muted);font-size:11px;text-align:right}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.me{margin-top:auto;display:flex;align-items:center;gap:11px;padding-top:18px;border-top:1px solid var(--rail-line)}
.me strong{font-size:13px}
.me small{display:block;line-height:1.2;color:var(--rail-muted)}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;background:hsl(var(--h,170) var(--avs) var(--avl));color:var(--avt)}
.me .av{background:var(--gold);color:#2a1a00}
/* page */
.page{min-width:0;padding:30px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:861px){.page{padding-left:44px;padding-right:44px;max-width:1240px}}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:18px 0 26px}
.head p{margin-top:12px;max-width:58ch;font-size:15px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:22px 0 4px}
.flow button{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);transition:border-color .15s,transform .15s}
.flow button:hover{border-color:var(--accent);transform:translateY(-1px)}
.flow .no{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--hover);color:var(--muted);font-weight:600}
.flow button.on{border-color:var(--accent);background:var(--accent-soft)}
.flow button.on .no{background:var(--accent);color:var(--accent-ink)}
.flow strong{display:block;font-size:13px}
.flow small{display:block;line-height:1.3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 17px;border-radius:10px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--line);background:var(--surface);transition:background .15s,transform .15s}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 6px 16px -8px var(--accent)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2a1a00}
.btn.full{width:100%}
.btn.sm{padding:7px 13px;font-size:12px}
.link{font-size:12px;font-weight:700;color:var(--accent-text)}
.link:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:grid;gap:4px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.stat strong{font-family:var(--display);font-size:42px;font-weight:500;line-height:1;margin:10px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0;box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:22px 24px}
.ph p{font-size:13px;margin-top:4px}
.pill{font-size:11px;font-family:var(--body);background:var(--accent-soft);color:var(--accent-text);padding:2px 9px;border-radius:99px;margin-left:8px;font-weight:800;vertical-align:3px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:0 24px 20px;border-bottom:1px solid var(--line);align-items:center}
.filters .search{flex:1 1 240px}
input,select,textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
textarea{resize:vertical;line-height:1.55}
.filters select{width:auto;flex:0 1 170px}
label{display:grid;gap:6px;font-size:12px;font-weight:700;color:var(--ink)}
label.ck{display:flex;gap:9px;align-items:flex-start;font-weight:500;font-size:13px}
label.ck input{margin-top:3px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);white-space:nowrap}
.tag.visit{background:var(--gold-soft);color:var(--gold-ink)}
.tag.q{background:var(--blue-soft);color:var(--blue-ink)}
.tag.neutral{background:var(--hover);color:var(--muted)}
.tag.loc{background:transparent;border:1px solid var(--line);color:var(--ink)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.st.New i{background:var(--gold)}.st.Contacted i{background:#4a86c9}.st.Replied i{background:#2f9f93}.st.Qualified i{background:#3f9d5d}
.muted{color:var(--muted)}
/* enquiry rows */
.lead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;padding:20px 24px;border-bottom:1px solid var(--line);align-items:start;transition:background .15s}
.lead:last-child{border-bottom:0}
.lead:hover{background:var(--hover)}
.lead .who{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lead .who strong{font-size:14px}
.lead p{color:var(--ink);margin:6px 0 10px;max-width:68ch;overflow-wrap:anywhere;font-size:14px}
.lead .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lead .go{align-self:center}
/* cards */
.empty{text-align:center;padding:64px 24px;display:grid;justify-items:center;gap:12px}
.empty p{max-width:46ch}
.empty svg.art{width:150px;height:auto;color:var(--accent)}
.band{display:flex;align-items:center;gap:16px;border:1px solid var(--line);background:linear-gradient(100deg,var(--accent-soft),var(--surface));padding:18px 22px;border-radius:16px;margin-bottom:20px;flex-wrap:wrap}
.band p{font-size:14px;color:var(--ink);flex:1 1 280px}
.notice{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 16px;margin:18px 0 0;font-size:13px;font-weight:600}
.notice button{padding:2px 6px}
.foot{margin-top:16px;color:var(--muted);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding:24px}
.lcard{border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:var(--surface);min-width:0;transition:transform .18s,box-shadow .18s}
.lcard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.media{position:relative;height:150px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#fff;background:linear-gradient(135deg,#2c7a62,#8aa84a)}
.media.t-flat{background:linear-gradient(135deg,#1c5d8c,#34a0a4)}
.media.t-house{background:linear-gradient(135deg,#a85a2a,#d9a038)}
.media.t-none{background:linear-gradient(135deg,#456, #789)}
.media::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.22),transparent 45%),linear-gradient(to top,rgba(5,20,20,.62),transparent 65%)}
.media>*{position:relative}
.media .gl{position:absolute;right:14px;top:14px;width:46px;height:46px;opacity:.9;color:#fff}
.media .srcchip{position:absolute;left:14px;top:14px;font-size:11px;font-weight:700;background:rgba(5,20,20,.45);backdrop-filter:blur(4px);padding:3px 10px;border-radius:99px}
.media .pr{font-family:var(--display);font-size:25px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.media .sz{font-size:12px;font-weight:700;opacity:.92}
.lbody{padding:16px 18px 18px;display:grid;gap:10px;align-content:start}
.lbody h3{overflow-wrap:anywhere}
.lbody .loc{font-size:13px;color:var(--muted)}
.cap{color:var(--ink);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.seller{display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px}
.seller .av{width:30px;height:30px;font-size:11px}
.seller b{display:block;font-size:12px}
.lact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips a{font-size:12px;font-weight:700;border:1px solid var(--line);padding:5px 12px;border-radius:99px;background:var(--surface)}
.chips a:hover{background:var(--hover)}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted,#667)}
.vbadge.ok{background:#e3f4ea;color:#14663a;border-color:#b7e0c6}
.vsteps{display:grid;gap:10px}
.vstep{display:grid;gap:8px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.vstep h4{margin:0;font-size:14px}
.vstep .acts{display:flex;flex-wrap:wrap;gap:8px}
.vbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.vbar i{display:block;height:100%;background:var(--accent,#e6a419);width:0;transition:width .2s}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.pcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.pcard .lbody{gap:12px}
.match{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent-text);padding:4px 11px;border-radius:99px;margin:0 6px 6px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:12px}
dt{color:var(--muted);font-weight:600}dd{margin:0;overflow-wrap:anywhere;font-weight:600}
hr{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.setup .panel{padding:26px;display:grid;gap:14px;align-content:start}
.setup ol{margin:0;padding-left:18px;display:grid;gap:8px;color:var(--muted)}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(5,18,19,.58);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:5vh 16px}
.ov.right{justify-content:flex-end;padding:0}
.dlg,.drw{background:var(--surface);color:var(--ink);position:relative;display:grid;gap:14px;align-content:start}
.dlg{width:min(580px,100%);border-radius:20px;padding:30px;border:1px solid var(--line);box-shadow:var(--shadow)}
.drw{width:min(560px,100%);min-height:100%;padding:30px max(24px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) 28px;border-left:1px solid var(--line);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.x{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--hover)}
.x:hover{background:var(--line)}
blockquote{margin:0;padding:16px 18px;background:var(--accent-soft);border-radius:14px;color:var(--ink);overflow-wrap:anywhere;white-space:pre-wrap;font-size:15px;font-family:var(--display)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.warn{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:10px;font-size:12px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;background:var(--surface)}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.log{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.sec{display:grid;gap:12px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));flex-direction:row;align-items:center;overflow:visible}
  .markets,.me{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--rail);border-top:1px solid var(--rail-line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 2px;text-align:center;justify-content:center}
  .nav .n{display:none}
  .page{padding-top:18px;padding-bottom:96px}
  .two{grid-template-columns:1fr}
  .flow{gap:8px}
  .flow button{flex-direction:column;text-align:center;gap:6px;padding:10px 6px}
  .flow small{display:none}
  .flow strong{font-size:12px}
  .lead{grid-template-columns:auto minmax(0,1fr)}
  .lead .go{grid-column:1 / -1}
  .lead .go .btn{width:100%}
  .drw{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.src{margin-bottom:20px}
.src summary{cursor:pointer;list-style:none;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.src summary::-webkit-details-marker{display:none}
.src summary p{font-size:13px;margin-top:4px}
.src summary::after{content:"Show";font-size:12px;font-weight:800;color:var(--accent-text)}
.src[open] summary::after{content:"Hide"}
.srcbody{padding:0 24px 24px;display:grid;gap:16px}
</style>

<script>

function classify(t){
  if(/not interested|not looking|don.t want|already bought|for sale|we sell|contact me for|dm me for/i.test(t))return 'Review needed';
  if(/site visit|can i visit|visit the (site|property)|చూడవచ్చా/i.test(t))return 'Site visit';
  if(/interested|want to buy|looking (for|to buy)|need (a |an )?(plot|house|flat|land)|కొనాలి|కావాలి/i.test(t))return 'Buying enquiry';
  if(/price|cost|location|where|details|available|ఎంత|ఎక్కడ|ధర/i.test(t))return 'Property question';
  return 'Review needed';
}
function igURL(s){try{var u=new URL(s);return u.protocol==='https:'&&/^(www\.)?instagram\.com$/.test(u.hostname)&&/^\/(p|reel)\/[A-Za-z0-9_-]+\/?$/.test(u.pathname)?'https://www.instagram.com'+u.pathname.replace(/\/?$/,'/'):'';}catch(e){return '';}}
function webURL(s){try{var u=new URL(String(s).trim());return u.protocol==='https:'&&u.hostname.indexOf('.')>0?u.href:'';}catch(e){return '';}}
function platformOf(url){var h='';try{h=new URL(url).hostname.replace(/^www\./,'');}catch(e){return '';}
  if(/instagram\.com$/.test(h))return 'Instagram';if(/facebook\.com$|fb\.com$/.test(h))return 'Facebook';if(/youtube\.com$|youtu\.be$/.test(h))return 'YouTube';if(/linkedin\.com$/.test(h))return 'LinkedIn';

function hid(s){var h=5381,g=52711;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h=((h*33)^c)>>>0;g=(g*31+c)>>>0;}return h.toString(36)+g.toString(36)+s.length.toString(36);}
function leadKey(l){return [l.username,l.post,l.text].join('|');}

function parseCSV(s){
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<s.length;i++){var c=s[i];
    if(c==='"'){if(q&&s[i+1]==='"'){cell+='"';i++;}else q=!q;}
    else if(c===','&&!q){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell='';}
    else cell+=c;}
  if(q)throw new Error('Unclosed quoted field in the CSV.');
  row.push(cell);if(row.some(Boolean))rows.push(row);
  var h=(rows.shift()||[]).map(function(v){return v.replace(/^﻿/,'').trim();});
  return rows.map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]||'';});return o;});
}
function csvSafe(v){v=String(v==null?'':v);if(/^\s*[=+@-]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function toCSV(rows,fields){return '﻿'+[fields.map(csvSafe).join(',')].concat(rows.map(function(r){return fields.map(function(k){return csvSafe(r[k]);}).join(',');})).join('\r\n');}

/* ---------- standalone storage (used when the page is not running inside Claude) ---------- */
function makeLocalDB(){
  var K='estate-enquiries-db-v1',data={},subs={};
  try{data=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(e){data={};}
  function save(){try{localStorage.setItem(K,JSON.stringify(data));}catch(e){}}
  function col(n){return data[n]||(data[n]={});}
  function snap(n){var docs=Object.keys(col(n)).sort().map(function(id){var d=data[n][id];return {id:id,exists:true,data:function(){return d;}};});return {docs:docs,size:docs.length,empty:!docs.length};}
  function fire(n){(subs[n]||[]).forEach(function(f){f(snap(n));});}
  return {
    collection:function(n){return {onSnapshot:function(next){(subs[n]=subs[n]||[]).push(next);setTimeout(function(){next(snap(n));},0);return function(){};}};},
    doc:function(path){var p=path.split('/'),n=p[0],id=p[1];return {
      set:function(o){col(n)[id]=o;save();fire(n);return Promise.resolve();},
      delete:function(){delete col(n)[id];save();fire(n);return Promise.resolve();},
      onSnapshot:function(next){var d=(data[n]||{})[id];setTimeout(function(){next({exists:!!d,data:function(){return d;}});},0);return function(){};}
    };}
  };
}

function save(kind,obj){
  dirty[kind+'/'+obj.id]={kind:kind,obj:obj};delete gone[kind+'/'+obj.id];
  S.saved=false;paintSync();clearTimeout(timer);timer=setTimeout(flush,500);
}
function remove(kind,id){

  S.saved=false;paintSync();clearTimeout(timer);timer=setTimeout(flush,200);
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
async function withRetry(fn){try{await fn();}catch(e){if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await sleep(1200+Math.random()*800);await fn();}else throw e;}}
async function flush(){
  if(flushing||!DB)return;flushing=true;
  try{
    while(Object.keys(dirty).length||Object.keys(gone).length){
      var work=[];
      Object.keys(dirty).forEach(function(k){work.push({k:k,del:false,v:dirty[k]});});
      Object.keys(gone).forEach(function(k){work.push({k:k,del:true,v:gone[k]});});
      var i=0;
      var worker=async function(){while(i<work.length){var w=work[i++];
        try{
          if(w.del){await withRetry(function(){return DB.doc(COL[w.v.kind]+'/'+w.v.id).delete();});if(gone[w.k]===w.v)delete gone[w.k];}
          else{var snapshot=w.v.obj;await withRetry(function(){return DB.doc(COL[w.v.kind]+'/'+snapshot.id).set(JSON.parse(JSON.stringify(snapshot)));});if(dirty[w.k]===w.v)delete dirty[w.k];}
        }catch(e){delete dirty[w.k];delete gone[w.k];S.notice=e&&e.code==='quota_exceeded'?'The database is full. Delete old records to add more.':'Some changes could not be saved: '+((e&&e.message)||'unknown error');renderPage();}
      };};
      await Promise.all([worker(),worker(),worker(),worker(),worker()]);
    }
  }finally{flushing=false;S.saved=true;paintSync();}
}
function applySnap(kind,docs){
  var arr=docs.map(function(d){return d.data();});
  var seen={};arr.forEach(function(o){seen[o.id]=1;});
  Object.keys(dirty).forEach(function(k){var d=dirty[k];if(d.kind!==kind)return;var ix=arr.findIndex(function(o){return o.id===d.obj.id;});if(ix>=0)arr[ix]=d.obj;else arr.push(d.obj);});
  arr=arr.filter(function(o){return !gone[kind+'/'+o.id];});
  S[kind]=arr;
}
async function boot(){
  renderAll();

  if(!c){try{c=makeLocalDB();S.local=true;}catch(e){c=null;}}
  if(!c){S.loaded=true;S.dbOn=false;renderAll();return;}
  DB=c;S.dbOn=true;
  var pending=3;var done=function(){if(--pending===0){S.loaded=true;}renderPage();};
  var sub=function(kind){var first=true;DB.collection(COL[kind]).onSnapshot(function(s){applySnap(kind,s.docs);if(first){first=false;done();}else renderPage();},function(e){S.notice='Could not load saved '+kind+': '+(e&&e.message||'error');if(first){first=false;done();}});};
  sub('leads');sub('props');sub('listings');

}

var VSTEPS=[
 ['pin','Pin the exact location','Open Google Maps, drop a pin on the land, click it and copy the coordinates (example 17.916482, 78.813686).'],
 ['survey','Find the survey number on Bhuvan 2D','Open Bhuvan 2D (ISRO), paste the coordinates in the search box and read the survey number the map shows.'],
 ['owner','Look up the owner on the state land portal','Pick district, mandal and village, search by survey number and note the pattadar name, khata, extent and land nature.'],
 ['match','Match the owner to the seller','The pattadar name should match the person selling, or their documented power of attorney.'],
 ['ec','Check the Encumbrance Certificate','Get the EC for this survey number from the registration department to see loans, disputes and earlier sales.'],
 ['site','Visit the site and confirm boundaries','Walk the land with the seller and check boundaries and access against the survey sketch.']
];
var VSTATES={
 'Andhra Pradesh':{portal:['Meebhoomi (Adangal / 1-B)','https://meebhoomi.ap.gov.in/'],ec:['AP Registration &amp; Stamps (EC)','https://registration.ap.gov.in/']},
 'Telangana':{portal:['Bhu Bharati (Land details)','https://bhubharati.telangana.gov.in/'],ec:['Telangana Registration (EC)','https://registration.telangana.gov.in/']}
};

function vMaps(v){var c=(v.coords||'').replace(/\s+/g,'');return /^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(c)?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c):'https://www.google.com/maps';}
function openVerify(id){

  function inp(k,l,ph){return '<label>'+l+'<input data-vf="'+k+'" value="'+esc(v[k]||'')+'" placeholder="'+(ph||'')+'"></label>';}
  var steps=VSTEPS.map(function(x,i){
    var links='';
    if(x[0]==='pin')links='<a class="btn sm" data-vlink="maps" href="'+vMaps(v)+'" target="_blank" rel="noreferrer">Open Google Maps '+IC.out+'</a>';

  layer.innerHTML='<div class="ov right"><section class="drw" role="dialog" aria-modal="true" aria-label="Verify land"><button class="x" data-act="close" aria-label="Close">'+IC.x+'</button><div class="eyebrow">Land verification</div><h2>'+esc(p.title)+'</h2><small>'+esc(p.city)+' · '+esc(p.type)+'</small>'+

   '<button type="button" class="btn sm pri" data-act="geo">Find village, mandal &amp; district from coordinates</button><small id="geonote">Survey number and owner come from government portals that ask for a captcha, so use the steps above for those.</small>'+

function vGeo(){
  var p=S.props.find(function(x){return cur&&x.id===cur.id;}),n=document.getElementById('geonote');if(!p||!n)return;var v=vOf(p);
  var m=(v.coords||'').match(/(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)/);
  if(!m){n.textContent='Enter coordinates like 17.916482, 78.813686 first.';return;}
  n.textContent='Looking up the location…';
  fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=en&lat='+m[1]+'&lon='+m[2]).then(function(r){if(!r.ok)throw new Error('x');return r.json();}).then(function(j){
    var a=j&&j.address;if(!a){n.textContent='No place found at these coordinates.';return;}
    var vals={village:a.village||a.hamlet||a.suburb||a.neighbourhood||a.town||a.city_district||a.city||'',mandal:(a.county||'').replace(/\s*Mandal$/i,''),district:(a.state_district||'').replace(/\s*District$/i,'')};
    Object.keys(vals).forEach(function(k){var el=document.querySelector('[data-vf="'+k+'"]');if(el&&vals[k]){el.value=vals[k];el.dispatchEvent(new Event('input',{bubbles:true}));}});
    var sel=document.querySelector('select[data-vf="state"]');if(sel&&VSTATES[a.state]){sel.value=a.state;sel.dispatchEvent(new Event('input',{bubbles:true}));}
    n.textContent='Found: '+(j.display_name||'')+'. Place names come from OpenStreetMap and can differ from revenue-record names, so confirm them on the land portal.';
  }).catch(function(){n.textContent='Lookup is not available here. It works on the live site with internet access.';});
}

function dlFile(name,data,mime){
  var local=function(){try{var type=/\.json$/.test(name)?'application/json':'text/csv;charset=utf-8';var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},1500);}catch(e){S.notice='Could not save the file.';renderPage();}};
  if(!(window.claude&&window.claude.use))return local();
  window.claude.use('downloads').then(function(d){
    if(!d)return local();
    return d.save({filename:name,data:data}).then(function(){S.notice='';},function(e){if(e&&e.code==='declined')return;S.notice='Could not save the file: '+((e&&e.message)||'error');renderPage();});
  }).catch(local);
}
async function doImport(){
  var raw=document.getElementById('m-raw').value.trim();if(!raw)return note('Choose a file or paste some data first.');
  var city=document.getElementById('m-city').value;
  try{
    var data=/^[\[{]/.test(raw)?JSON.parse(raw):parseCSV(raw);
    if(cur.kind==='comments'){
      if(!Array.isArray(data)||data.length>10000)throw new Error('Use a CSV or a JSON array with up to 10,000 rows.');
      var fresh=normalizeComments(data,document.getElementById('m-post').value,city,document.getElementById('m-platform').value);
      if(!fresh.length)throw new Error('No usable comments. Each row needs a username and text, or ownerUsername and text.');
      var have={};S.leads.forEach(function(l){have[leadKey(l)]=1;});var add=[];
      fresh.forEach(function(l){if(!have[l.key]){have[l.key]=1;add.push(l);}});
      add.forEach(function(l){S.leads.push(l);save('leads',l);});
      S.notice=add.length+' comments added; '+(fresh.length-add.length)+' duplicates skipped. Buyer requirements stay blank until reviewed.';
    }else{
      var rows;
      if(data&&!Array.isArray(data)&&data.kind==='estate-discovery'&&Array.isArray(data.rows))rows=data.rows.filter(function(r){return r&&r.id&&webURL(r.url);});
      else{if(!Array.isArray(data)||data.length>10000)throw new Error('Use a CSV or a JSON array with up to 10,000 posts.');rows=normalizeListings(data,city,'');}
      if(!rows.length)throw new Error('No usable listings. Each row needs a caption and an Instagram post or reel URL (url or postUrl).');
      var seen={};S.listings.forEach(function(l){seen[l.id]=1;});var n=0;
      rows.forEach(function(r){if(!seen[r.id]){seen[r.id]=1;S.listings.push(r);save('listings',r);n++;}});
      S.notice=n+' posts imported; '+(rows.length-n)+' duplicates skipped. All property details need review.';
    }
    closeLayer();renderPage();
  }catch(e){note(e.message||'Could not read that data.');}
}
function backup(){
  var strip=function(a){return a.map(function(o){return o;});};
  dlFile('estate-enquiries-backup.json',JSON.stringify({version:2,leads:strip(S.leads),properties:strip(S.props),listings:strip(S.listings)},null,2));
}
async function restore(file){
  try{
    if(file.size>10000000)throw new Error('Backup exceeds 10 MB.');
    var b=JSON.parse(await file.text()),a=0;
    if(!b||!Array.isArray(b.leads)||!Array.isArray(b.properties))throw new Error('Invalid backup format.');
    var have={};S.leads.forEach(function(l){have[leadKey(l)]=1;});
    b.leads.forEach(function(l){if(!l||!l.username||!l.text)return;l.key=leadKey(l);l.id=hid(l.key);if(!have[l.key]){have[l.key]=1;S.leads.push(l);save('leads',l);a++;}});
    var pid={};S.props.forEach(function(p){pid[p.id]=1;});
    b.properties.forEach(function(p){if(p&&p.id&&!pid[p.id]){pid[p.id]=1;S.props.push(p);save('props',p);a++;}});
    var lid={};S.listings.forEach(function(p){lid[p.id]=1;});
    (b.listings||b.rows||[]).forEach(function(r){if(r&&r.url&&webURL(r.url)){r.id=hid(r.url);if(!lid[r.id]){lid[r.id]=1;S.listings.push(r);save('listings',r);a++;}}});
    S.notice='Backup merged: '+a+' records added.';
  }catch(e){S.notice=e.message||'Could not read that backup.';}
  renderPage();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el){if(ev.target.classList&&ev.target.classList.contains('ov'))closeLayer();return;}
  var act=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  if(act==='tab'){S.tab=v;try{localStorage.setItem('ee-tab',v);}catch(e){}paintNav();renderPage();}
  else if(act==='dismiss'){S.notice='';renderPage();}
  else if(act==='modal')openModal(v);
  else if(act==='close')closeLayer();
  else if(act==='clearF'){S.f={q:'',city:'',intent:'',status:'',pf:'',region:'',lq:'',lsale:false,lstatus:'',lsrc:''};renderPage();}
  else if(act==='openLead')openLead(id);
  else if(act==='ch'){cur.ch=v;Array.prototype.forEach.call(document.querySelectorAll('#chs button'),function(b){b.classList.toggle('on',b.dataset.v===v);});setDraft();}
  else if(act==='logc'){var ll=curLead();if(ll){ll.contacts=(ll.contacts||[]).concat([{ch:cur.ch,at:new Date().toISOString()}]);if(ll.status==='New')ll.status='Contacted';save('leads',ll);var st=document.querySelector('[data-lf="status"]');if(st)st.value=ll.status;refreshOut();}}
  else if(act==='openListing')openListing(id);
  else if(act==='openVerify')openVerify(id);
  else if(act==='geo')vGeo();
  else if(act==='sample'){document.getElementById('m-raw').value=cur.kind==='comments'?SAMPLE_C:SAMPLE_L;}
  else if(act==='doImport')doImport();
  else if(act==='exportLeads')dlFile('property-enquiries.csv',toCSV(filteredLeads(),LEAD_FIELDS));
  else if(act==='exportListings')dlFile('discovered-properties.csv',toCSV(S.listings,LIST_FIELDS));
  else if(act==='backup')backup();
  else if(act==='delProp'){S.props=S.props.filter(function(p){return p.id!==id;});remove('props',id);renderPage();}
  else if(act==='saveName'){var n=document.getElementById('s-name').value.trim();if(n){S.name=n;if(DB)withRetry(function(){return DB.doc('settings/main').set({name:n});}).catch(function(){});S.notice='Name saved.';renderPage();}}
  else if(act==='copyDraft'){
    var ta=document.getElementById('draft'),dn=document.getElementById('dnote');
    var ok=function(){dn.innerHTML='<div class="warn" role="status">Message copied. Review and send it manually in Instagram.</div>';};
    var fb=function(){ta.focus();ta.select();dn.innerHTML='<div class="warn" role="status">Press copy on your device to copy the selected text.</div>';};
    try{navigator.clipboard.writeText(ta.value).then(ok,fb);}catch(e){fb();}
  }
  else if(act==='addProp'){
    var r=S.listings.find(function(x){return x.id===cur.id;}),dn2=document.getElementById('dnote');
    var ap=document.getElementById('approve').checked;
    if(!ap||!r.title.trim()||CITIES.indexOf(r.city)<0||TYPES.indexOf(r.type)<0||!(Number(r.price)>0)||r.status!=='Confirmed available'){dn2.innerHTML='<div class="warn" role="status">Enter title, city, type and the full asking price. Set availability to Confirmed available and tick the confirmation before adding.</div>';dn2.scrollIntoView({block:'center'});return;}
    var pid=r.inventoryId||(crypto.randomUUID?crypto.randomUUID():hid(String(Date.now())+Math.random()));
    var p={id:pid,title:r.title.trim(),city:r.city,type:r.type,price:String(r.price),source:r.url,area:r.area,contact:r.contact,advertiser:r.username,role:r.role,notes:r.notes,images:r.images||''};
    var ix=S.props.findIndex(function(x){return x.id===pid;});if(ix<0)S.props.push(p);
    r.inventoryId=pid;save('props',p);save('listings',r);
    S.notice='Property added to your inventory with its original source.';closeLayer();renderPage();
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.dataset.f){var k=t.dataset.f;S.f[k]=t.type==='checkbox'?t.checked:t.value;renderPage();return;}
  if(t.dataset.lf&&cur&&cur.kind==='lead'){var l=S.leads.find(function(x){return x.id===cur.id;});if(l){l[t.dataset.lf]=t.value;save('leads',l);var d=document.getElementById('draft');if(d&&!d.dataset.touched&&['location','type','country'].indexOf(t.dataset.lf)>=0){var sel=document.getElementById('mprop');d.value=tpl(cur.ch,l,sel&&sel.value?S.props.find(function(x){return x.id===sel.value;}):null);}refreshOut();}return;}
  if((t.dataset.vf||t.dataset.vs)&&cur&&cur.kind==='verify'){var vp=S.props.find(function(x){return x.id===cur.id;});if(vp){var vv=vOf(vp);if(t.dataset.vs){vv.steps[t.dataset.vs]=t.checked;}else{vv[t.dataset.vf]=t.value;}save('props',vp);vProg(vp);
      if(t.dataset.vf==='coords'){var a=document.querySelector('[data-vlink="maps"]');if(a)a.href=vMaps(vv);}
      if(t.dataset.vf==='state'){var q=VSTATES[vv.state]||VSTATES['Andhra Pradesh'];var a1=document.querySelector('[data-vlink="portal"]'),a2=document.querySelector('[data-vlink="ec"]');if(a1){a1.href=q.portal[1];a1.innerHTML=q.portal[0]+' '+IC.out;}if(a2){a2.href=q.ec[1];a2.innerHTML=q.ec[0]+' '+IC.out;}}}return;}
  if(t.dataset.rf&&cur&&cur.kind==='listing'){var r=S.listings.find(function(x){return x.id===cur.id;});if(r){r[t.dataset.rf]=t.value;save('listings',r);}return;}
  if(t.id==='draft'){t.dataset.touched='1';refreshOut();}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){S.f[t.dataset.f]=t.value;renderPage();}
  if(t.id==='mprop'){setDraft();}
  if(t.id==='m-file'&&t.files[0]){var f=t.files[0];if(f.size>10000000){note('Use a file smaller than 10 MB.');return;}f.text().then(function(x){document.getElementById('m-raw').value=x;});}
  if(t.id==='restore'&&t.files[0]){restore(t.files[0]);t.value='';}
});
document.addEventListener('submit',function(ev){
  ev.preventDefault();
  if(ev.target.id==='pform'){
    var p={id:crypto.randomUUID?crypto.randomUUID():hid(String(Date.now())+Math.random()),title:document.getElementById('p-title').value.trim(),city:document.getElementById('p-city').value,type:document.getElementById('p-type').value,price:document.getElementById('p-price').value};
    if(!p.title)return;S.props.push(p);save('props',p);closeLayer();S.notice='Property added. Matches use reviewed buyer requirements.';renderPage();
  }
});
document.addEventListener('toggle',function(e){if(e.target.classList&&e.target.classList.contains('src'))S.srcOpen=e.target.open;},true);
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&layer.innerHTML)closeLayer();});
window.addEventListener('beforeunload',function(){});
boot();
})();
</script>

</body>
</html>
